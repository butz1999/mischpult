# C++23 without exceptions and RTTI (AGENTS.md). Fallback is C++20.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
# Zephyr's default is the minimal C++ library (no <array>, <span>, <expected>).
# The full libstdc++ of the SDK is needed for the standard headers (AGENTS.md).
CONFIG_GLIBCXX_LIBCPP=y

# WS2812 on the board is driven through SPI, see boards/*.overlay.
CONFIG_LED_STRIP=y
CONFIG_LOG=y
# Deferred logging: messages are buffered and a log thread prints them later.
# Default wake-up is 1000 ms, which makes the output arrive in bursts. 100 ms
# keeps it close to real time. The cost is one more wake-up per 100 ms
# (power consumption not measured).
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
